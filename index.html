<!DOCTYPE html>
<html lang="sp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="color_menu_container">
        <button id="color_menu_button" class="button">Open Background Color Menu</button>
            <div  id="color_menu" class="color_menu">
                <!--color menu buttons-->
                <button id="style_button_1" class="button">Default</button>
                <button id="style_button_2" class="button">Deep Blue</button>
                <button id="style_button_3" class="button">Pink</button>
                <button id="custom_color_button" class="button">Custom Color</button>
                <div class="color_chooser_menu">
                    <input id="bg color" class="input_box">
                    <input id="bg1 color" class="input_box">
                    <input id="bg2 color" class="input_box">
                    <button id="color_confirmation" class="button">Confirm</button>
                </div>
            </div>
    </div>

    <div>
        <h1 id="9" class="text text_line">&nbsp;</h1>
        <h1 id="8" class="text text_line">&nbsp;</h1>
        <h1 id="7" class="text text_line">&nbsp;</h1>
        <h1 id="6" class="text text_line">&nbsp;</h1>
        <h1 id="5" class="text text_line">&nbsp;</h1>
        <h1 id="4" class="text text_line">&nbsp;</h1>
        <h1 id="3" class="text text_line">Welcome!</h1>
        <h1 id="2" class="text text_line">run "help" for command help.</h1>
        <h1 id="1" class="text text_line">Begin? Y/N</h1>
    </div>
    
    <div class="input_container">
        <span class="arrow">&gt;</span>
        <input id="input" class="input" type="text" spellcheck="false" autocapitalize="false">
        <button id="button" class="hidden_element"></button>
    </div>


    <script src="backend.js"></script>
</body>
</html>
